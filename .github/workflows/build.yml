name: Release packages

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.package_format }} packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # immortalwrt 24.10.x uses opkg (ipk)
          - package_format: ipk
            sdk_base_url: https://downloads.immortalwrt.org/releases/24.10.5/targets/x86/64
            sdk_pattern: immortalwrt-sdk-24.10.5-x86-64_.*Linux-x86_64.tar.zst
          # immortalwrt 25.12.x uses apk
          - package_format: apk
            sdk_base_url: https://downloads.immortalwrt.org/releases/25.12.0/targets/x86/64
            sdk_pattern: immortalwrt-sdk-25.12.0-x86-64_.*Linux-x86_64.tar.zst

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y \
            build-essential \
            bison \
            clang \
            curl \
            file \
            flex \
            g++ \
            g++-multilib \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-venv \
            rsync \
            unzip \
            wget \
            xz-utils \
            zlib1g-dev \
            zstd

      - name: Resolve release version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if ! printf '%s' "${version}" | grep -Eq '^[0-9][0-9A-Za-z._~+-]*$'; then
            echo "::error::Tag '${tag}' cannot be used as an OpenWrt package version."
            echo "::error::Use a version tag like v1.2.3 or 1.2.3."
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Release tag: ${tag}"
          echo "Package version: ${version}"

      - name: Resolve OpenWrt SDK metadata
        id: sdk
        env:
          SDK_BASE_URL: ${{ matrix.sdk_base_url }}
          SDK_PATTERN: ${{ matrix.sdk_pattern }}
        run: |
          sdk_line="$(
            curl -fsSL "${SDK_BASE_URL}/sha256sums" |
              grep -E "[[:space:]]+\\*?${SDK_PATTERN}$" |
              head -n 1
          )"

          if [ -z "${sdk_line}" ]; then
            echo "::error::Unable to find SDK matching '${SDK_PATTERN}' at ${SDK_BASE_URL}."
            exit 1
          fi

          sdk_sha256="$(printf '%s\n' "${sdk_line}" | awk '{print $1}')"
          sdk_file="$(printf '%s\n' "${sdk_line}" | awk '{print $2}' | sed 's/^\*//')"

          echo "sdk_file=${sdk_file}" >> "${GITHUB_OUTPUT}"
          echo "sdk_sha256=${sdk_sha256}" >> "${GITHUB_OUTPUT}"
          echo "sdk_cache_key=openwrt-sdk-${{ matrix.package_format }}-${sdk_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Cache OpenWrt SDK archive
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: .cache/openwrt-sdk/${{ steps.sdk.outputs.sdk_file }}
          key: ${{ steps.sdk.outputs.sdk_cache_key }}

      - name: Download OpenWrt SDK
        env:
          SDK_BASE_URL: ${{ matrix.sdk_base_url }}
          SDK_FILE: ${{ steps.sdk.outputs.sdk_file }}
          SDK_SHA256: ${{ steps.sdk.outputs.sdk_sha256 }}
        run: |
          mkdir -p .cache/openwrt-sdk

          if [ ! -f ".cache/openwrt-sdk/${SDK_FILE}" ]; then
            curl -fL "${SDK_BASE_URL}/${SDK_FILE}" -o ".cache/openwrt-sdk/${SDK_FILE}"
          fi

          printf '%s  %s\n' "${SDK_SHA256}" ".cache/openwrt-sdk/${SDK_FILE}" | sha256sum -c -

          mkdir -p sdk
          case "${SDK_FILE}" in
            *.tar.zst)
              tar --zstd -xf ".cache/openwrt-sdk/${SDK_FILE}" -C sdk --strip-components=1
              ;;
            *.tar.xz)
              tar -xJf ".cache/openwrt-sdk/${SDK_FILE}" -C sdk --strip-components=1
              ;;
            *)
              echo "::error::Unsupported SDK archive: ${SDK_FILE}"
              exit 1
              ;;
          esac

      - name: Prepare OpenWrt feeds
        working-directory: sdk
        run: |
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare local packages
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p sdk/package

          rsync -a --delete \
            --exclude='.git' \
            --exclude='sdk' \
            --exclude='artifacts' \
            "${GITHUB_WORKSPACE}/luci-app-adguardhome/" \
            sdk/package/luci-app-adguardhome/

          sed -i -E "s/^(PKG_VERSION):=.*/\1:=${RELEASE_VERSION}/" sdk/package/luci-app-adguardhome/Makefile
          sed -i -E "s/^(PKG_RELEASE):=.*/\1:=1/" sdk/package/luci-app-adguardhome/Makefile

          # The 25.12 immortalwrt SDK's luci feed ships its own luci-app-adguardhome
          # (po/templates only, no zh_Hans), which collides with this repo's package
          # and shadows it. Uninstall the feed copy so only our package is built.
          (cd sdk && ./scripts/feeds uninstall luci-app-adguardhome) || true

      - name: Configure packages
        working-directory: sdk
        run: |
          cat > .config <<'EOF'
          CONFIG_ALL_NONSHARED=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          CONFIG_AUTOREMOVE=n
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-adguardhome=m
          EOF

          sed -i 's/^[[:space:]]*//' .config
          make defconfig

      - name: Compile packages
        working-directory: sdk
        run: |
          make package/luci-app-adguardhome/clean
          make package/luci-app-adguardhome/compile -j"$(nproc)" V=s

      - name: Collect packages
        env:
          PACKAGE_FORMAT: ${{ matrix.package_format }}
        run: |
          mkdir -p "artifacts/${PACKAGE_FORMAT}"

          if [ "${PACKAGE_FORMAT}" = "apk" ]; then
            find sdk/bin/packages -type f \
              \( -name "luci-app-adguardhome-*.apk" \
              -o -name "luci-i18n-adguardhome-*.apk" \) \
              -exec cp -v {} "artifacts/${PACKAGE_FORMAT}/" \;

            app_count="$(find "artifacts/${PACKAGE_FORMAT}" -maxdepth 1 -type f -name "luci-app-adguardhome-*.apk" | wc -l)"
            i18n_count="$(find "artifacts/${PACKAGE_FORMAT}" -maxdepth 1 -type f -name "luci-i18n-adguardhome-*.apk" | wc -l)"
          else
            find sdk/bin/packages -type f \
              \( -name "luci-app-adguardhome_*.ipk" \
              -o -name "luci-i18n-adguardhome-*.ipk" \) \
              -exec cp -v {} "artifacts/${PACKAGE_FORMAT}/" \;

            app_count="$(find "artifacts/${PACKAGE_FORMAT}" -maxdepth 1 -type f -name "luci-app-adguardhome_*.ipk" | wc -l)"
            i18n_count="$(find "artifacts/${PACKAGE_FORMAT}" -maxdepth 1 -type f -name "luci-i18n-adguardhome_*.ipk" | wc -l)"
          fi

          if [ "${app_count}" -lt 1 ] || [ "${i18n_count}" -lt 1 ]; then
            echo "::error::Missing expected packages for ${PACKAGE_FORMAT}."
            find sdk/bin/packages -maxdepth 3 -type f | sort
            find "artifacts/${PACKAGE_FORMAT}" -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.package_format }}
          path: artifacts/${{ matrix.package_format }}/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: packages-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
